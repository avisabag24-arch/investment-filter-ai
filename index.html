<!DOCTYPE html>
<html>
<head>
  <title>Investment Analyzer</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    input {
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }

    .card {
      margin-top: 20px;
      padding: 15px;
      background: #1e293b;
    }
  </style>
</head>

<body>

<h1>Investment Analyzer</h1>

<input id="ticker" placeholder="AAPL">
<button onclick="analyze()">Analyze</button>

<div id="result"></div>

<script>

async function analyze() {

  const ticker = document.getElementById("ticker").value;

  try {

    const res = await fetch('/api?ticker=' + ticker);

    const data = await res.json();

    console.log("DEBUG:", data); // ✅ נראה אם מגיע נתון

    document.getElementById("result").innerHTML = `
      <div class="card">
        <h2>${data.ticker}</h2>
        <p>Score: ${data.score}</p>
        <p>${data.decision}</p>
        <p>${data.summary}</p>
      </div>
    `;

  } catch (err) {

    document.getElementById("result").innerHTML = `
      <div class="card">
        ❌ Error loading data
      </div>
    `;

    console.error(err);
  }
}

</script>
