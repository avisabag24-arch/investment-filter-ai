<!DOCTYPE html>
<html>
<head>
  <title>Investment Analyzer PRO</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #0b1220;
      color: white;
    }

    .container {
      width: 900px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      text-align: center;
    }

    .search {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      width: 250px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px 20px;
      margin-left: 10px;
      border-radius: 8px;
      border: none;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
    }

    .score {
      font-size: 40px;
      font-weight: bold;
    }

    .decision {
      padding: 6px 12px;
      border-radius: 10px;
    }

    .buy { background: green; }
    .watch { background: orange; }

    /* ✅ טאבים */
    .tabs {
      margin-top: 20px;
    }

    .tabs button {
      background: #334155;
      margin-right: 5px;
    }

    .tabs button.active {
      background: #22c55e;
    }

    .kpis {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .kpi {
      flex: 1;
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .bar {
      margin-top: 10px;
    }

    .bar-bg {
      height: 10px;
      background: #334155;
      border-radius: 6px;
    }

    .bar-fill {
      height: 10px;
      background: #22c55e;
      border-radius: 6px;
    }

    .good {
      background: #065f46;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .bad {
      background: #7f1d1d;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

<h1>📊 Investment Analyzer PRO</h1>

<div class="search">
  <input id="ticker" placeholder="AAPL">
  <button onclick="analyze()">Analyze</button>
</div>

<div id="top"></div>

<div class="tabs">
  <button onclick="showTab('business')">Business</button>
  <button onclick="showTab('financial')">Financials</button>
  <button onclick="showTab('technical')">Technical</button>
  <button onclick="showTab('risks')">Risks</button>
</div>

<div id="content"></div>

</div>

<script>

let dataStore = {};

function rand() {
  return Math.floor(Math.random() * 4) + 6;
}

async function analyze() {

  const ticker = document.getElementById("ticker").value;

  const res = await fetch(`/api?ticker=${ticker}`);
  const data = await res.json();

  dataStore = data;

  document.getElementById("top").innerHTML = `
    <div class="card header">
      <div>
        <h2>${data.ticker}</h2>
        <p>${data.summary}</p>
      </div>
      <div>
        <div class="score">${data.score}/10</div>
        <div class="decision ${data.decision.includes("BUY") ? "buy" : "watch"}">
          ${data.decision}
        </div>
      </div>
    </div>
  `;

  showTab("business");
}

function showTab(tab) {

  if (tab === "business") {
    document.getElementById("content").innerHTML = `
      <div class="card">

        <div class="kpis">
          <div class="kpi">לקוחות<br>2700+</div>
          <div class="kpi">Growth<br>גבוה</div>
          <div class="kpi">Margin<br>גבוה</div>
        </div>

        ${bar("Business", rand())}
        ${bar("Market Position", rand())}

        <div class="good">✅ Strong growth and market leadership</div>
        <div class="bad">⚠️ Competition risk</div>

      </div>
    `;
  }

  if (tab === "financial") {
    document.getElementById("content").innerHTML = `
      <div class="card">

        <div class="kpis">
          <div class="kpi">Revenue<br>$19M</div>
          <div class="kpi">EBITDA<br>$5M</div>
          <div class="kpi">Growth<br>18%</div>
        </div>

        ${bar("Revenue Growth", rand())}
        ${bar("Profitability", rand())}

        <div class="good">✅ Strong financial growth</div>
        <div class="bad">⚠️ Profit risk</div>

      </div>
    `;
  }

  if (tab === "technical") {
    document.getElementById("content").innerHTML = `
      <div class="card">

        ${bar("Trend", rand())}
        ${bar("Momentum", rand())}

        <div class="good">✅ Bullish trend</div>
        <div class="bad">⚠️ High volatility</div>

      </div>
    `;
  }

  if (tab === "risks") {
    document.getElementById("content").innerHTML = `
      <div class="card">

        <div class="bad">⚠️ Revenue concentration</div>
        <div class="bad">⚠️ Competition risk</div>

        <div class="good">✅ Diversified customer base</div>

      </div>
    `;
  }

}

function bar(title, val) {
  return `
    <div class="bar">
      <div>${title} (${val}/10)</div>
      <div class="bar-bg">
        <div class="bar-fill" style="width:${val*10}%"></div>
      </div>
    </div>
  `;
}

</script>

</body>
</html>
