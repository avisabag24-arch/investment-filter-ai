<!DOCTYPE html>
<html>
<head>
  <title>Investment Analyzer</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #0b1220;
      color: white;
    }

    .container {
      width: 900px;
      margin: auto;
      padding: 30px;
    }

    input {
      padding: 10px;
      width: 250px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #22c55e;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .card {
      background: #1e293b;
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
    }

    .tabs button {
      margin: 5px;
      background: #334155;
    }

    .tabs button.active {
      background: #22c55e;
    }

    .bar {
      margin-top: 10px;
    }

    .bar-bg {
      height: 10px;
      background: #334155;
      border-radius: 6px;
    }

    .bar-fill {
      height: 10px;
      background: #22c55e;
      border-radius: 6px;
    }

    .good {
      background: #065f46;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .bad {
      background: #7f1d1d;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

<h2>Investment Analyzer</h2>

<input id="ticker" placeholder="AAPL">
<button onclick="analyze()">Analyze</button>

<div id="top"></div>

<div class="tabs">
  <button onclick="showTab('business')">Business</button>
  <button onclick="showTab('financials')">Financials</button>
  <button onclick="showTab('technical')">Technical</button>
  <button onclick="showTab('risks')">Risks</button>
</div>

<div id="content"></div>

</div>

<script>

let DATA = {};

async function analyze() {

  const ticker = document.getElementById("ticker").value;

  const res = await fetch(`/api/ai?ticker=${ticker}`);
  const data = await res.json();

  DATA = data;

  document.getElementById("top").innerHTML = `
    <div class="card">
      <h2>${data.ticker}</h2>
      <h1>${data.score}/10</h1>
      <h3>${data.decision}</h3>
      <p>${data.summary}</p>
    </div>
  `;

  showTab("business");
}

function showTab(tab) {

  const c = DATA.categories[tab];

  document.getElementById("content").innerHTML = `
    <div class="card">
      <h3>${tab.toUpperCase()} (${c.score}/10)</h3>

      ${bar("Score", c.score)}

      <div class="good">
        ✅ ${c.strengths.join(", ")}
      </div>

      <div class="bad">
        ⚠️ ${c.risks.join(", ")}
      </div>

    </div>
  `;
}

function bar(label, val) {
  return `
    <div class="bar">
      <div>${label}</div>
      <div class="bar-bg">
        <div class="bar-fill" style="width:${val*10}%"></div>
      </div>
    </div>
  `;
}

</script>

</body>
</html>
