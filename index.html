<!DOCTYPE html>
<html>
<head>
  <title>Investment Analyzer PRO</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #0b1220;
      color: white;
    }

    .container {
      width: 900px;
      margin: auto;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    input {
      padding: 12px;
      width: 250px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 12px 20px;
      background: #22c55e;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 25px;
      margin-top: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score {
      font-size: 40px;
      font-weight: bold;
    }

    .decision {
      font-size: 18px;
      padding: 6px 12px;
      border-radius: 10px;
    }

    .buy { background: #065f46; }
    .watch { background: #78350f; }

    .kpis {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .kpi {
      flex: 1;
      background: #0f172a;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
    }

    .tabs {
      margin-top: 20px;
    }

    .tabs button {
      background: #334155;
      margin-right: 8px;
    }

    .bars {
      margin-top: 20px;
    }

    .bar {
      margin-bottom: 10px;
    }

    .bar-title {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }

    .bar-bg {
      height: 10px;
      background: #334155;
      border-radius: 6px;
    }

    .bar-fill {
      height: 10px;
      background: #22c55e;
      border-radius: 6px;
    }

    .good {
      background: #065f46;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .bad {
      background: #7f1d1d;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

<h1>📊 Investment Analyzer PRO</h1>

<div class="search-box">
  <input id="ticker" placeholder="Enter Ticker (AAPL)">
  <button onclick="analyze()">Analyze</button>
</div>

<div id="result"></div>

</div>

<script>

function rand() {
  return Math.floor(Math.random() * 4) + 6;
}

async function analyze() {

  const ticker = document.getElementById("ticker").value;

  const res = await fetch(`/api?ticker=${ticker}`);
  const data = await res.json();

  const business = rand();
  const financial = rand();
  const technical = rand();
  const valuation = rand();

  document.getElementById("result").innerHTML = `

    <div class="card">

      <div class="header">
        <div>
          <h2>${data.ticker}</h2>
          <p>${data.summary}</p>
        </div>
        <div>
          <div class="score">${data.score}/10</div>
          <div class="decision ${data.decision.includes("BUY") ? "buy" : "watch"}">
            ${data.decision}
          </div>
        </div>
      </div>

      <div class="kpis">
        <div class="kpi">Growth<br><b>${business}/10</b></div>
        <div class="kpi">Financials<br><b>${financial}/10</b></div>
        <div class="kpi">Technical<br><b>${technical}/10</b></div>
      </div>

      <div class="bars">
        ${bar("Business", business)}
        ${bar("Financials", financial)}
        ${bar("Technical", technical)}
        ${bar("Valuation", valuation)}
      </div>

      <div class="good">
        ✅ Strong growth and market leadership
      </div>

      <div class="bad">
        ⚠️ Competition and valuation risks
      </div>

    </div>
  `;
}

function bar(title, val) {
  return `
    <div class="bar">
      <div class="bar-title">
        <span>${title}</span>
        <span>${val}/10</span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" style="width:${val*10}%"></div>
      </div>
    </div>
  `;
}

</script>

</body>
</html>
