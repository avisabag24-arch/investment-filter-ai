<!DOCTYPE html>
<html>
<head>
  <title>Investment Analyzer PRO</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    h1 {
      margin-bottom: 30px;
    }

    input {
      padding: 12px;
      font-size: 18px;
      width: 220px;
      border-radius: 6px;
      border: none;
    }

    button {
      padding: 12px 18px;
      font-size: 18px;
      margin-left: 10px;
      background: #22c55e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .card {
      margin-top: 40px;
      padding: 30px;
      background: #1e293b;
      border-radius: 16px;
      width: 420px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }

    .score-box {
      font-size: 36px;
      font-weight: bold;
    }

    .decision {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .bar-container {
      margin-top: 10px;
    }

    .bar-label {
      font-size: 14px;
    }
